name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          # configure-pages devuelve la ruta del repositorio o una ruta vacía
          # cuando Pages usa el dominio propio indicado por CNAME.
          GITHUB_PAGES_BASE: "${{ steps.pages.outputs.base_path }}/"
        run: bun run build

      - name: Assemble Pages output
        run: |
          set -euo pipefail
          test -s dist/client/_shell.html
          rm -rf _site
          cp -r dist/client _site
          # El shell de la SPA es la página de entrada y el fallback de rutas.
          cp _site/_shell.html _site/index.html
          cp _site/_shell.html _site/404.html
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/404.html
          test -d _site/assets
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
